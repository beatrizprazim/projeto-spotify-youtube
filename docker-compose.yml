services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: tendencias
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d tendencias"]
      interval: 5s
      retries: 10

  etl:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://etl:etl@db:5432/tendencias
    command: ["python", "-m", "src.pipeline"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://etl:etl@db:5432/tendencias
    ports:
      - "8501:8501"
    depends_on:
      etl:
        condition: service_completed_successfully

volumes:
  pgdata:
